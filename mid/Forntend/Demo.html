<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Institution Homepage</title>
  <link rel="stylesheet" href="styles.css">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  line-height: 1.6;
  background-color: #f4f4f4;
  color: #333;
}

header {
  background-color: #333;
  padding: 10px 0;
}

nav ul {
  list-style-type: none;
  text-align: center;
}

nav ul li {
  display: inline-block;
  margin: 0 20px;
}

nav ul li a {
  color: #fff;
  text-decoration: none;
  font-size: 18px;
}

nav ul li a:hover {
  color: #f4f4f4;
}

/* Main Content */
main {
  padding: 20px;
  max-width: 1200px;
  margin: 20px auto;
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

section {
  margin-bottom: 40px;
}

h1, h2 {
  color: #333;
}

h2 {
  margin-top: 20px;
}

ul {
  list-style-type: none;
  padding-left: 20px;
}

ul li {
  margin: 8px 0;
}

/* Footer */
footer {
  text-align: center;
  background-color: #333;
  color: #fff;
  padding: 10px 0;
  position: fixed;
  bottom: 0;
  width: 100%;
}

/* Responsive Design */
@media (max-width: 768px) {
  nav ul li {
    display: block;
    margin: 10px 0;
  }

  main {
    padding: 10px;
  }
}
</style>

</head>
<body>

  
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="About_us.html">About Us</a></li>
        <li><a href="Courses.html">Courses</a></li>
        <li><a href="Contract_Us.html">Contact</a></li>
        
      </ul>
    </nav>
  </header>

  
  <main>
    <section id="home">
      <h1>Welcome to XYZ Institution</h1>
      <p>Your future begins here. Providing quality education to help you succeed in life.</p>
    </section>

   
    
  </main>

  <footer>
    <p>&copy; 2024 XYZ Institution. All rights reserved.</p>
  </footer>

</body>
</html>
